version: 2
updates:
  # Before merging Actions PRs, verify the version tag actually exists on GitHub.
  # Dependabot has been known to propose non-existent major versions (e.g. v6).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Slidev 52.20+ pulls in UnoCSS 66.10+, which breaks `slidev build`
    # (lightningcss minify: Invalid token in pseudo element). Remove once fixed upstream.
    ignore:
      - dependency-name: "@slidev/cli"
        versions: [">=52.20.0"]
